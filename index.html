<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stockfish Chess</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;

        background: #f4f4f4;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        padding: 25px;
    }

    h1 {
        margin-bottom: 5px;
    }

    #status {
        margin-top: 5px;

        font-weight: bold;
        font-size: 18px;
    }

    #engineStatus {
        margin-top: 6px;

        color: #666;
        font-size: 14px;
    }

    #board {
        width: 480px;
        height: 480px;

        margin-top: 20px;

        display: grid;

        grid-template-columns:
            repeat(8, 60px);

        grid-template-rows:
            repeat(8, 60px);

        border: 4px solid #333;
    }

    .square {
        width: 60px;
        height: 60px;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        font-size: 43px;

        cursor: pointer;

        user-select: none;
    }

    .light {
        background: #f0d9b5;
    }

    .dark {
        background: #b58863;
    }

    .selected {
        outline: 4px solid #ffd500;
        outline-offset: -4px;
    }

    .legal::after {
        content: "";

        position: absolute;

        width: 16px;
        height: 16px;

        border-radius: 50%;

        background:
            rgba(
                50,
                200,
                80,
                0.75
            );
    }

    .capture::after {
        content: "";

        position: absolute;

        inset: 6px;

        border-radius: 50%;

        border:
            5px solid
            rgba(
                50,
                200,
                80,
                0.75
            );
    }

    .check {
        box-shadow:
            inset
            0
            0
            0
            6px
            red;
    }

    #controls {
        margin-top: 15px;
    }

    button {
        padding:
            10px
            20px;

        font-size: 16px;

        border: none;

        border-radius: 8px;

        background: #4c6fff;

        color: white;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        filter: brightness(1.08);
    }

    #thinking {
        margin-top: 10px;

        color: #777;

        min-height: 20px;
    }

    @media (
        max-width: 600px
    ) {

        #board {
            width: 92vw;
            height: 92vw;

            grid-template-columns:
                repeat(
                    8,
                    11.5vw
                );

            grid-template-rows:
                repeat(
                    8,
                    11.5vw
                );
        }

        .square {
            width: 11.5vw;
            height: 11.5vw;

            font-size: 8vw;
        }
    }
</style>
</head>

<body>

<h1>Stockfish Chess</h1>

<div id="status">
    White to move
</div>

<div id="engineStatus">
    Loading Stockfish...
</div>

<div id="thinking"></div>

<div id="board"></div>

<div id="controls">

    <button id="newGameButton">
        New Game
    </button>

</div>


<!--
IMPORTANT:

chess.js must load BEFORE
our main program.
-->

<script src="chess.js"></script>


<script>

/*
=================================
CHESS PIECE SYMBOLS
=================================
*/

const pieceSymbols = {

    wp: "♙",
    wn: "♘",
    wb: "♗",
    wr: "♖",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    bn: "♞",
    bb: "♝",
    br: "♜",
    bq: "♛",
    bk: "♚"

};


/*
=================================
CREATE CHESS GAME
=================================
*/

let game =
    new Chess();


/*
=================================
BOARD SELECTION
=================================
*/

let selectedSquare =
    null;

let selectedMoves =
    [];


/*
=================================
STOCKFISH
=================================
*/

let stockfish =
    null;

let stockfishReady =
    false;

let stockfishThinking =
    false;


/*
=================================
START STOCKFISH
=================================
*/

function startStockfish() {

    stockfish =
        new Worker(
            "stockfish-18-lite-single.js"
        );


    stockfish.onmessage =
        function(event) {

            const message =
                String(
                    event.data
                );


            console.log(
                "Stockfish:",
                message
            );


            /*
            UCI initialized.
            */

            if (
                message ===
                "uciok"
            ) {

                stockfish.postMessage(
                    "isready"
                );

            }


            /*
            Engine ready.
            */

            if (
                message ===
                "readyok"
            ) {

                stockfishReady =
                    true;

                document
                    .getElementById(
                        "engineStatus"
                    )
                    .textContent =
                    "Stockfish ready";

            }


            /*
            Engine returned move.
            */

            if (
                message.startsWith(
                    "bestmove"
                )
            ) {

                const parts =
                    message.split(
                        " "
                    );


                const move =
                    parts[1];


                stockfishThinking =
                    false;


                document
                    .getElementById(
                        "thinking"
                    )
                    .textContent =
                    "";


                if (
                    !move ||
                    move === "(none)"
                ) {

                    updateStatus();

                    return;
                }


                makeStockfishMove(
                    move
                );

            }

        };


    stockfish.onerror =
        function(error) {

            console.error(
                error
            );


            document
                .getElementById(
                    "engineStatus"
                )
                .textContent =
                "Stockfish failed to load";

        };


    stockfish.postMessage(
        "uci"
    );

}


/*
=================================
DRAW BOARD
=================================
*/

function drawBoard() {

    const boardElement =
        document.getElementById(
            "board"
        );


    boardElement.innerHTML =
        "";


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square " +
                (
                    (
                        row +
                        col
                    ) %
                    2 ===
                    0
                        ? "light"
                        : "dark"
                );


            const squareName =
                coordinatesToSquare(
                    row,
                    col
                );


            /*
            Highlight selected square.
            */

            if (
                selectedSquare ===
                squareName
            ) {

                square
                    .classList
                    .add(
                        "selected"
                    );

            }


            /*
            Highlight legal move.
            */

            const legalMove =
                selectedMoves.find(
                    move =>
                        move.to ===
                        squareName
                );


            if (legalMove) {

                const targetPiece =
                    game.get(
                        squareName
                    );


                if (targetPiece) {

                    square
                        .classList
                        .add(
                            "capture"
                        );

                } else {

                    square
                        .classList
                        .add(
                            "legal"
                        );

                }

            }


            /*
            Show pieces.
            */

            const piece =
                game.get(
                    squareName
                );


            if (piece) {

                const pieceKey =
                    piece.color +
                    piece.type;


                square.textContent =
                    pieceSymbols[
                        pieceKey
                    ];

            }


            /*
            Check highlight.
            */

            if (
                piece &&
                piece.type === "k" &&
                piece.color ===
                    game.turn() &&
                game.isCheck()
            ) {

                square
                    .classList
                    .add(
                        "check"
                    );

            }


            square.addEventListener(
                "click",
                function() {

                    squareClicked(
                        squareName
                    );

                }
            );


            boardElement
                .appendChild(
                    square
                );

        }

    }

}


/*
=================================
CONVERT BOARD COORDINATES
=================================
*/

function coordinatesToSquare(
    row,
    col
) {

    const file =
        String.fromCharCode(
            97 + col
        );


    const rank =
        8 - row;


    return (
        file +
        rank
    );

}


/*
=================================
PLAYER CLICK
=================================
*/

function squareClicked(
    square
) {

    /*
    Don't let player move
    while Stockfish is thinking.
    */

    if (
        stockfishThinking
    ) {

        return;

    }


    /*
    Player controls White.
    */

    if (
        game.turn() !== "w"
    ) {

        return;

    }


    /*
    Game already finished.
    */

    if (
        game.isGameOver()
    ) {

        return;

    }


    /*
    We already selected
    a piece.
    */

    if (
        selectedSquare
    ) {

        const legalMove =
            selectedMoves.find(
                move =>
                    move.to ===
                    square
            );


        if (legalMove) {

            /*
            Promotion defaults
            to queen.
            */

            const result =
                game.move({

                    from:
                        selectedSquare,

                    to:
                        square,

                    promotion:
                        "q"

                });


            selectedSquare =
                null;

            selectedMoves =
                [];


            if (result) {

                drawBoard();

                updateStatus();


                if (
                    !game
                        .isGameOver()
                ) {

                    setTimeout(
                        askStockfish,
                        100
                    );

                }

            }


            return;

        }

    }


    /*
    Select white piece.
    */

    const piece =
        game.get(
            square
        );


    if (
        piece &&
        piece.color === "w"
    ) {

        selectedSquare =
            square;


        selectedMoves =
            game.moves({

                square:
                    square,

                verbose:
                    true

            });


    } else {

        selectedSquare =
            null;

        selectedMoves =
            [];

    }


    drawBoard();

}


/*
=================================
ASK STOCKFISH FOR A MOVE
=================================
*/

function askStockfish() {

    if (
        !stockfishReady
    ) {

        document
            .getElementById(
                "thinking"
            )
            .textContent =
            "Waiting for Stockfish...";

        setTimeout(
            askStockfish,
            300
        );

        return;

    }


    if (
        game.isGameOver()
    ) {

        updateStatus();

        return;

    }


    stockfishThinking =
        true;


    document
        .getElementById(
            "thinking"
        )
        .textContent =
        "Stockfish thinking...";


    const fen =
        game.fen();


    console.log(
        "Sending FEN:",
        fen
    );


    stockfish.postMessage(
        "position fen " +
        fen
    );


    /*
    Give Stockfish
    1 second to think.
    */

    stockfish.postMessage(
        "go movetime 1000"
    );

}


/*
=================================
STOCKFISH MOVE
=================================
*/

function makeStockfishMove(
    uciMove
) {

    /*
    Example:

    e7e5

    or promotion:

    e2e1q
    */


    const from =
        uciMove.substring(
            0,
            2
        );


    const to =
        uciMove.substring(
            2,
            4
        );


    let promotion =
        "q";


    if (
        uciMove.length >=
        5
    ) {

        promotion =
            uciMove[4];

    }


    const result =
        game.move({

            from:
                from,

            to:
                to,

            promotion:
                promotion

        });


    if (!result) {

        console.error(
            "Stockfish returned illegal move:",
            uciMove
        );


        document
            .getElementById(
                "engineStatus"
            )
            .textContent =
            "Engine move error";

        return;

    }


    drawBoard();

    updateStatus();

}


/*
=================================
GAME STATUS
=================================
*/

function updateStatus() {

    const status =
        document.getElementById(
            "status"
        );


    if (
        game.isCheckmate()
    ) {

        if (
            game.turn() === "w"
        ) {

            status.textContent =
                "Checkmate — Stockfish wins";

        } else {

            status.textContent =
                "Checkmate — You win";

        }


        return;

    }


    if (
        game.isStalemate()
    ) {

        status.textContent =
            "Stalemate";

        return;

    }


    if (
        game.turn() === "w"
    ) {

        status.textContent =
            "White to move";

    } else {

        status.textContent =
            "Stockfish to move";

    }


    if (
        game.isCheck()
    ) {

        status.textContent +=
            " — CHECK";

    }

}


/*
=================================
NEW GAME
=================================
*/

function newGame() {

    game =
        new Chess();


    selectedSquare =
        null;


    selectedMoves =
        [];


    stockfishThinking =
        false;


    document
        .getElementById(
            "thinking"
        )
        .textContent =
        "";


    if (stockfish) {

        stockfish.postMessage(
            "stop"
        );

        stockfish.postMessage(
            "ucinewgame"
        );

        stockfish.postMessage(
            "isready"
        );

    }


    drawBoard();

    updateStatus();

}


/*
=================================
BUTTON
=================================
*/

document
    .getElementById(
        "newGameButton"
    )
    .addEventListener(
        "click",
        newGame
    );


/*
=================================
START EVERYTHING
=================================
*/

drawBoard();

updateStatus();

startStockfish();

</script>

</body>
</html>
